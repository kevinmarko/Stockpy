# InvestYo ML Model Registry
# ===========================
# Lists production models with their paths, training metadata, and CPCV validation metrics.
# Updated automatically by the monthly retraining job scripts/retrain_models.py
# (scheduled via the launchd plist scripts/com.investyo.monthly-retrain.plist).
#
# Fields
# ------
# role:            what the model does in the pipeline
# path:            conventional model location, informational only — the runtime loader
#                  (<Class>.load_latest()) never reads this field; it discovers the model
#                  by glob-sorting dated ml/models/<prefix>_<YYYYMMDD>.pkl files. See
#                  artifact_file below for the exact binary behind a given run's metrics.
# trained_date:    ISO date of most recent training run
# cpcv_dsr:        Deflated Sharpe Ratio from CPCV path evaluation (target > 0.95)
# pbo:             Probability of Backtest Overfitting from CPCV (target < 0.50)
# n_train:         number of training samples in the most recent run
# notes:           any caveats, data limitations, or scope restrictions
# deployable:      true iff cpcv_dsr > 0.95 AND pbo < 0.50 AND meets Gravity gates
#
# Provenance fields (optional; captured for reproducibility — never affect `deployable`)
# ----------------------------------------------------------------------------------------
# artifact_file:   exact dated pickle filename actually written this run (e.g. lgbm_20260706.pkl)
# hyperparameters: the model's training hyperparameters (dict)
# train_window:    the data-split window {start, end, n_dates} (dates as YYYY-MM-DD strings)
# features:        the ordered feature-column list the model trained with (list)

models:
  lgbm_ranker:
    role: cross_sectional_ranker
    path: ml/models/lgbm_latest.pkl
    trained_date: '2026-07-27'
    cpcv_dsr: 0.9958509492258514
    pbo: 0.4
    n_train: 250
    deployable: true
    notes: LightGBM LambdaRank model for cross-sectional return rank prediction. Trained monthly on an
      expanding window of dashboard_df snapshots via PITFeatureStore. NDCG@1 monitored in CV logs. Weight
      in settings.SIGNAL_WEIGHTS["lgbm_ranker"] = 0.10 (modest until validated at > 200 out-of-sample
      dates).
    artifact_file: lgbm_20260727.pkl
    hyperparameters:
      objective: lambdarank
      metric: ndcg
      num_leaves: 31
      learning_rate: 0.03
      n_estimators: 1000
      lambda_l1: 0.1
      lambda_l2: 0.1
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 1
      verbose: -1
    train_window:
      start: '2026-01-06'
      end: '2026-06-23'
      n_dates: 25
    features:
    - ROC_12M
    - ROC_6M
    - GARCH_Vol
    - RSI
    - RSI_2
    - book_to_market
    - earnings_yield
    - quality_factor_score
    - low_vol_score
    - vix_level
    - Value_Z
    - Quality_Z
    - LowVol_Z
    - Size_Z
    - ROC_12M_rank
    - ROC_6M_rank
    - GARCH_Vol_rank
    - RSI_rank
    - RSI_2_rank
    - book_to_market_rank
    - earnings_yield_rank
    - quality_factor_score_rank
    - low_vol_score_rank
  meta_labeler_timeseries_momentum:
    role: meta_labeler
    path: ml/models/meta_timeseries_momentum_latest.pkl
    trained_date: '2026-08-02'
    cpcv_dsr: 2.6186446803844043e-12
    pbo: 0.13333333333333333
    n_train: 948
    deployable: false
    notes: Binary LightGBM classifier predicting P(timeseries_momentum signal correct). Trained on triple-barrier
      labels from ml/triple_barrier.py. If predict_proba < settings.META_LABEL_MIN_CONFIDENCE (0.4), the
      position size for that cycle is zeroed by SignalAggregator.
    artifact_file: meta_timeseries_momentum_20260802.pkl
    hyperparameters:
      objective: binary
      metric: binary_logloss
      num_leaves: 15
      learning_rate: 0.05
      n_estimators: 500
      lambda_l1: 0.1
      lambda_l2: 0.1
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 1
      verbose: -1
      class_weight: balanced
    train_window:
      start: '2024-08-01'
      end: '2026-07-31'
      n_dates: 501
    features:
    - momentum
    - realized_vol_20d
    - dist_sma_50
    - vol_ewma
  meta_labeler_cross_sectional_momentum:
    role: meta_labeler
    path: ml/models/meta_cross_sectional_momentum_latest.pkl
    trained_date: '2026-08-02'
    cpcv_dsr: 0.0015573664329870435
    pbo: 0.26666666666666666
    n_train: 856
    deployable: false
    notes: Binary LightGBM classifier predicting P(cross_sectional_momentum signal correct). Shares the
      same triple-barrier label construction and feature set as the timeseries momentum meta-labeler;
      trained and persisted independently.
    artifact_file: meta_cross_sectional_momentum_20260802.pkl
    hyperparameters:
      objective: binary
      metric: binary_logloss
      num_leaves: 15
      learning_rate: 0.05
      n_estimators: 500
      lambda_l1: 0.1
      lambda_l2: 0.1
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 1
      verbose: -1
      class_weight: balanced
    train_window:
      start: '2024-08-01'
      end: '2026-07-31'
      n_dates: 501
    features:
    - momentum
    - realized_vol_20d
    - dist_sma_50
    - vol_ewma
