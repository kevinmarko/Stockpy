models:
  lgbm_ranker:
    role: cross_sectional_ranker
    path: ml/models/lgbm_latest.pkl
    trained_date: '2026-08-14'
    cpcv_dsr: 0.9924906429751158
    pbo: 0.26666666666666666
    n_train: 460
    deployable: true
    notes: LightGBM LambdaRank model for cross-sectional return rank prediction. Trained
      monthly on an expanding window of dashboard_df snapshots via PITFeatureStore.
      NDCG@1 monitored in CV logs. Weight in settings.SIGNAL_WEIGHTS["lgbm_ranker"]
      = 0.10 (modest until validated at > 200 out-of-sample dates).
    artifact_file: lgbm_20260814.pkl
    hyperparameters:
      objective: lambdarank
      metric: ndcg
      num_leaves: 31
      learning_rate: 0.03
      n_estimators: 1000
      lambda_l1: 0.1
      lambda_l2: 0.1
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 1
      verbose: -1
    train_window:
      start: '2025-08-19'
      end: '2026-07-14'
      n_dates: 46
    features:
    - ROC_12M
    - ROC_6M
    - GARCH_Vol
    - RSI
    - RSI_2
    - book_to_market
    - earnings_yield
    - quality_factor_score
    - low_vol_score
    - vix_level
    - Value_Z
    - Quality_Z
    - LowVol_Z
    - Size_Z
    - paper_fill_rate_30d
    - paper_order_count_30d
    - paper_size_variance_30d
    - paper_size_vs_kelly_ratio_30d
    - paper_hit_rate_30d
    - paper_avg_realized_pnl_30d
    - ROC_12M_rank
    - ROC_6M_rank
    - GARCH_Vol_rank
    - RSI_rank
    - RSI_2_rank
    - book_to_market_rank
    - earnings_yield_rank
    - quality_factor_score_rank
    - low_vol_score_rank
    cpcv_mean_oos_sharpe: 2.44254533455499
    cpcv_mean_oos_max_dd: 0.012603120222581282
  meta_labeler_timeseries_momentum:
    role: meta_labeler
    path: ml/models/meta_timeseries_momentum_latest.pkl
    trained_date: '2026-08-14'
    cpcv_dsr: 5.382150328888693e-45
    pbo: 0.0
    n_train: 16469
    deployable: false
    notes: Binary LightGBM classifier predicting P(timeseries_momentum signal correct).
      Trained on triple-barrier labels from ml/triple_barrier.py. If predict_proba
      < settings.META_LABEL_MIN_CONFIDENCE (0.4), the position size for that cycle
      is zeroed by SignalAggregator.
    artifact_file: meta_timeseries_momentum_20260814.pkl
    hyperparameters:
      objective: binary
      metric: binary_logloss
      num_leaves: 15
      learning_rate: 0.05
      n_estimators: 500
      lambda_l1: 0.1
      lambda_l2: 0.1
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 1
      verbose: -1
      class_weight: balanced
    train_window:
      start: '2012-02-16'
      end: '2026-08-14'
      n_dates: 3644
    features:
    - momentum
    - realized_vol_20d
    - dist_sma_50
    - vol_ewma
    - primary_score
    cpcv_mean_oos_sharpe: -0.6992039531766724
