<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Pinch-zoom intentionally left enabled (no maximum-scale/user-scalable=no):
         disabling it is a WCAG 1.4.4 (Resize Text) failure. iOS Safari's
         focus-zoom, the thing that lock was guarding against, is already
         prevented by the --t-input 16px floor in index.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0e11" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Browse and follow Stockpy quant strategy Pilots — honest backtests, paper-first."
    />
    <title>Stockpy Pilots</title>
  </head>

    <div id="root"></div>
