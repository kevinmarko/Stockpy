name: Deploy MCP Server VM
on:
  push:
    branches: [ "main" ]
    paths:
      - 'investyo_mcp_server.py'
      - 'robinhood_execution_mcp.py'
      - 'data/**'
      - 'execution/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          service_account: 'my-service-account@my-project.iam.gserviceaccount.com'
          
      - uses: google-github-actions/setup-gcloud@v2
      
      - run: gcloud compute instances update-container mcp-vm --zone us-central1-a --container-image us-central1-docker.pkg.dev/my-project/my-repo/mcp-server:${{ github.sha }}
