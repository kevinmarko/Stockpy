name: ML Leakage Audit

on:
  push:
    paths:
      - 'ml/**'
  pull_request:
    paths:
      - 'ml/**'

permissions:
  contents: read

jobs:
  audit:
    name: ML Data Leakage Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stockpy Codebase Auditor
        run: python scripts/auditor/stockpy_codebase_auditor.py --root ml/ --fail-on HIGH
