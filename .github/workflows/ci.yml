name: CI

# Runs the offline pytest suite on every push to main and every pull request.
# Network/live tests (real Yahoo Finance / Wikipedia / broker calls) are tagged
# `@pytest.mark.network` and deselected here via `-m "not network"` so CI stays
# deterministic and offline. Python is pinned to 3.12 — the only version the
# project supports (setup.sh / launch*.command hard-abort on anything else).
#
# `test` (the main offline suite) additionally deselects `@pytest.mark.slow`
# (long-running tests — heavy real ARIMA/GARCH/LightGBM fits) so PRs stay
# fast; `test-slow` runs those same tests in a SEPARATE job that starts
# concurrently with `test`, so slow-marked coverage still runs on every PR at
# no extra wall-clock cost — this is a speed reorganization, not a coverage
# cut. Network tests are covered separately by the scheduled `nightly.yml`
# workflow, which runs the FULL suite (network + slow) against real upstreams.
#
# The `webapp` job separately gates the Pilots PWA (webapp/) — typecheck,
# vitest, and a production build — so a break there is caught the same way as
# a Python test failure. It runs offline against the mock API layer
# (VITE_USE_MOCK defaults true), same as `npm run test`/`npm run build` locally.
#
# The `bandit` job runs a Python SAST scan independent of CodeQL Advanced
# (.github/workflows/codeql.yml) and its GitHub code-scanning API dependency
# — see docs/known_issues/codeql_advanced_outage_and_bandit_addition.md for
# why. It reports via plain exit code, never uploads SARIF anywhere.
#
# `test`, `test-slow`, and `security` each cache the interpreter's own
# fully-INSTALLED `bin/` + site-packages (keyed on a hash of
# requirements.txt), not just pip's download cache -- see the `test` job's
# "Cache Python install" step for the full rationale, including why this
# deliberately targets setup-python's own install location rather than a
# separate `.venv`, and why it covers `bin/` (console scripts / native
# binaries like ruff's) as well as site-packages, not site-packages alone.
# All three jobs share the same cache key, so whichever finishes installing
# first on a cold cache primes it for the other two on their next run.

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run when new commits land on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (offline suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Caches the fully-INSTALLED Python environment, not just pip's
      # download cache (setup-python's `cache: pip` above already covers
      # that layer). The ~500+ MB of compiled wheels this project depends on
      # (lightgbm, scipy, statsmodels, scikit-learn, prophet's bundled
      # cmdstan, pyarrow, ...) still cost ~70-80s to unpack/link on every run
      # even with a warm download cache -- that unpack cost is what this
      # second cache layer removes.
      #
      # Caches BOTH `$pythonLocation/bin` and `.../site-packages` -- not
      # just site-packages alone. An earlier version of this cache covered
      # site-packages only, and a real warm-cache run failed both `ruff`
      # (its `__main__.py` calls `find_ruff_bin()`, which needs the actual
      # Rust binary from `bin/ruff`, not just the Python wrapper in
      # site-packages) and `pip-audit` (its own console-script entry point
      # also lives in `bin/`) with "binary not found" / "command not
      # found" -- `pip install` sees the package's dist-info already
      # present in the restored site-packages and skips regenerating the
      # `bin/` entry point that was never part of the cached path to begin
      # with. `bin/` is small (executables and wrapper scripts, not
      # multi-hundred-MB packages) so this doesn't meaningfully grow the
      # cache; caching the whole `$pythonLocation` directory instead was
      # considered and rejected -- that would also duplicate the base
      # interpreter/stdlib setup-python's own tool-cache already manages.
      #
      # (An even earlier version relocated installs into a separate
      # workspace-relative `.venv` instead of `$pythonLocation` at all;
      # reverted after a measured ~19% slower pytest run pointed at a
      # slower disk under the checkout workspace vs. `/opt/hostedtoolcache`
      # -- see git history for the numbers. That comparison turned out to
      # be confounded by run-to-run variance and the bin/ bug above, but
      # restoring into the interpreter's own install location is still the
      # right call: it's the same disk and path every non-cached run uses.)
      #
      # The cache key includes the exact resolved Python patch version
      # (`steps.setup-python.outputs.python-version`, not just `3.12`) so a
      # future GitHub-side interpreter bump can never restore a binary built
      # against a different patch release -- it just misses and falls
      # through to a normal fresh install. restore-keys falls back to the
      # most recent cache for this OS+version even when requirements.txt
      # changed, so a routine dependency bump only pays the install cost for
      # the packages that actually changed.
      - name: Cache Python install
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pythonLocation }}/bin
            ${{ env.pythonLocation }}/lib/python3.12/site-packages
          key: python-install-v2-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            python-install-v2-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          # Scoped to genuine-bug rules only (undefined names, syntax errors)
          # -- NOT the full default ruleset, which the existing codebase has
          # ~1200 pre-existing style violations against (unused imports, the
          # deliberate tensorflow-before-pandas E402 import-order pattern,
          # etc.) that a focused PR should not be gated on fixing wholesale.
          # Widening `--select` is a deliberate follow-up, not an accident.
          python -m ruff check . --select=F821,F822,F823,E9

      - name: Run offline test suite
        run: |
          # --cov reads .coveragerc, which sets fail_under=58 (a coverage-floor
          # ratchet — see docs/test_coverage_analysis.md Phase 5 item 8). A
          # regression below that floor fails this step even if every test
          # passes; coverage.json is still written first, so the summary step
          # below still runs (it's `if: always()`).
          # --cov-report=json is the only coverage report written here; the
          # expensive --cov-report=term-missing table (300+ source files) was
          # dropped because the CI summary step reads only coverage.json and
          # the fail_under gate is enforced by the run itself, not the table.
          #
          # -n auto (pytest-xdist) fans the suite out across the runner's CPUs.
          # pytest-cov auto-detects xdist and combines each worker's coverage
          # data before writing the reports below, so --cov-report output is
          # unaffected; no .coveragerc changes are needed. --durations=10
          # (pytest.ini) prints the 10 slowest tests, aggregated across workers,
          # at the end of the run.
          #
          # --dist loadgroup keeps every @pytest.mark.xdist_group("...")-tagged
          # test together on one worker (currently: test_settings_liveness.py,
          # test_train_lgbm.py, test_backtest_sector_configs_cli.py's
          # TestOfflineCLIRun, test_settings_keysets.py, test_orchestrator_e2e.py,
          # test_etf_transmission_sensitivity_sweep.py,
          # test_sector_forecast_backtest.py) so their module/class-scoped
          # fixtures build once, not once per worker that happens to get a
          # split share of the group. Every other (unmarked) test still balances
          # freely across workers exactly as under the default `load` distribution.
          #
          # --timeout=180 --timeout-method=thread (pytest-timeout) turns a
          # hang into a fast failure instead of burning the full 6h job
          # budget. `thread` (not `signal`) is required to interrupt blocking
          # C extensions (statsmodels/lightgbm/arch) — `signal` cannot. 180s
          # is a wide margin over the slowest test on this job (`not slow`
          # deselects the real ARIMA/GARCH/LightGBM-fit-heavy tests below).
          #
          # -m "not network and not slow": network tests need live upstreams
          # (see nightly.yml); slow tests run in the parallel `test-slow` job
          # below instead of serially in this one.
          python -m pytest -m "not network and not slow" -v --tb=short \
            --cov --cov-report=json \
            -n auto --dist loadgroup --timeout=180 --timeout-method=thread

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.json ]; then
            python -c "import json; d=json.load(open('coverage.json')); print(f'Total coverage: {d[\"totals\"][\"percent_covered\"]:.1f}%')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "coverage.json not found; skipping coverage summary" >> "$GITHUB_STEP_SUMMARY"
          fi

  test-slow:
    name: test (slow suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # See the `test` job's "Cache Python install" step above for the full
      # rationale, including why this covers both `bin/` and site-packages
      # rather than site-packages alone, or a workspace-relative `.venv`.
      - name: Cache Python install
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pythonLocation }}/bin
            ${{ env.pythonLocation }}/lib/python3.12/site-packages
          key: python-install-v2-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            python-install-v2-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run slow-marked test suite
        run: |
          # The counterpart to `test`'s `-m "not slow"` deselection above --
          # runs @pytest.mark.slow tests (real ARIMA/Holt-Winters/GARCH/
          # LightGBM fits) concurrently with the main job so PR coverage is
          # unchanged, just reorganized for wall-clock. No --cov here: this
          # job doesn't gate the coverage floor (that stays on `test`, which
          # covers the overwhelming majority of the suite); adding a second
          # coverage measurement here would need `coverage combine` plumbing
          # for no real benefit given how few tests carry this marker today.
          python -m pytest -m "slow and not network" -v --tb=short \
            -n auto --timeout=600 --timeout-method=thread

  webapp:
    name: webapp (Pilots PWA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm run test

      - name: Build (typecheck + production build)
        run: npm run build

  bandit:
    name: bandit (SAST)
    runs-on: ubuntu-latest
    # A plain lint step that reports via exit code -- deliberately does NOT
    # upload SARIF to GitHub's code-scanning ingestion API the way
    # codeql.yml's CodeQL Advanced workflow does. That API has its own
    # availability risk independent of this repo (a live GitHub-side outage
    # blocked CodeQL's SARIF uploads for days in August 2026 without any
    # actual code defect involved), and Bandit is meant as a fast,
    # always-available supplement to CodeQL, not a replacement -- see
    # docs/known_issues/ (search "CodeQL Advanced" / "bandit") for the
    # full incident writeup this addition follows from.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install bandit
        run: python -m pip install --upgrade pip bandit

      - name: Bandit SAST scan
        run: |
          # Scoped to medium+ severity AND medium+ confidence (-ll -ii) --
          # not bandit's full default output, which surfaces hundreds of
          # low-severity/low-confidence style-only findings this codebase
          # has never triaged (same "genuine-bug rules only" posture as the
          # ruff step in the `test` job above, not a full-ruleset gate).
          # Excludes tests/ (test fixtures deliberately exercise unsafe
          # patterns to prove a guard rejects them -- see
          # tests/test_security_audit_fixes.py) and webapp/ (TypeScript,
          # out of Bandit's scope; covered by the `webapp` job instead).
          # Every finding Bandit's medium+/medium+ baseline surfaced as of
          # this workflow's introduction was triaged and is either a
          # confirmed false positive (documented inline via `# nosec BXXX`
          # at the exact flagged line, never a blanket per-rule skip, so a
          # genuine future instance of the same rule still trips this gate)
          # or a real, already-sandboxed pattern (the two AST-validated
          # exec() sandboxes in validation/autonomous_backtest_runner.py and
          # llm/research_copilot.py) -- so this step starts EXIT-CODE
          # BLOCKING (a fresh unreviewed finding fails the build), not
          # report-only.
          python -m bandit -r . -x './tests,./webapp,./.venv,./node_modules,./gui' -ll -ii

  security:
    name: security (pip-audit)
    runs-on: ubuntu-latest
    # Runs concurrently with `test`, `test-slow`, `webapp`, and `bandit` so it
    # is no longer on the test job's critical path. pip-audit installs itself
    # then makes a network call to the PyPA advisory DB; running it in its own
    # job removes that sequential overhead (~30-60 s) from the test job's
    # wall-clock time. See docs/known_issues/pip_audit_stale_ambient_env_false_positive.md
    # for why we install the real requirements.txt into this job's own
    # interpreter first and audit against that, not an ambient Python.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # See the `test` job's "Cache Python install" step for the full
      # rationale, including why this covers both `bin/` and site-packages
      # rather than site-packages alone, or a workspace-relative `.venv`.
      - name: Cache Python install
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pythonLocation }}/bin
            ${{ env.pythonLocation }}/lib/python3.12/site-packages
          key: python-install-v2-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            python-install-v2-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          # Audits the packages actually resolved from requirements.txt in
          # THIS job's interpreter against the PyPA advisory DB -- not an
          # ambient/unrelated Python install, which is what produced the misleading
          # 36-"vulnerability" report documented in
          # docs/known_issues/pip_audit_stale_ambient_env_false_positive.md
          # (every flagged package was already safe here once pinned
          # versions were actually installed). A real regression here means
          # someone loosened a pin in requirements.txt to a genuinely
          # vulnerable version, which is exactly what this step exists to
          # catch.
          pip install pip-audit
          pip-audit --desc
