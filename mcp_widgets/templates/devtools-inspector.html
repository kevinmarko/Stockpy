<!doctype html>
<meta charset="utf-8" />
<style>
/*__WIDGET_COMMON_CSS__*/
</style>
<body>
  <div id="root"></div>
</body>
<script type="module">
/*__EXT_APPS_BUNDLE__*/
/*__WIDGET_COMMON_JS__*/
const { App } = globalThis.ExtApps;
(async () => {
  const app = new App({ name: "DevToolsInspector", version: "1.0.0" }, {}, { autoResize: true });

  app.ontoolresult = ({ content }) => {
    const payload = extractJsonPayload(content[0].text);
    const root = document.getElementById("root");
    root.innerHTML = "";
    if (payload) {
      renderDevToolsInspector(root, payload);
    } else {
      const p = document.createElement("p");
      p.className = "empty-state";
      p.textContent = "No inspection data returned from Chrome DevTools.";
      root.appendChild(p);
    }
  };

  await app.connect();
  const ctx = app.getHostContext?.();
  if (ctx) applyHostTheme(ctx.theme);
  app.onhostcontextchanged = (c) => applyHostTheme(c.theme);
})();
</script>
